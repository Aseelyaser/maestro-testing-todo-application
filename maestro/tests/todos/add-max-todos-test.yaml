appId: com.qacart.todo_app
---
- launchApp:
    clearState: true
- runFlow: 
    label: "Login flow"
    file: "../../flows/auth/login-flow.yaml"
    env: 
        EMAIL: "user@qacart.com"
        PASSWORD: "Test@1234"
- assertVisible:
    id: "plan_name"
    text: "Free plan"

- runFlow: 
    label: "Add new todo"
    file: "../../flows/todos/add-todo-flow.yaml"
    env: 
        TODO_TEXT: "Learn Maestro 1"
        TODO_INDEX: "0"

- runFlow: 
    label: "Add new todo"
    file: "../../flows/todos/add-todo-flow.yaml"
    env: 
        TODO_TEXT: "Learn Maestro 2"
        TODO_INDEX: "1"


- runFlow: 
    label: "Add new todo"
    file: "../../flows/todos/add-todo-flow.yaml"
    env: 
        TODO_TEXT: "Learn Maestro 3"
        TODO_INDEX: "2"

- assertVisible: 
    text: "New todo\nLimit reached — upgrade to add more"
    enabled: false

- assertVisible:
    id: "add_todo_button"
    enabled: false

- assertVisible:
    id: "plan_usage"
    text: "3 / 3"

- assertVisible:
    id: "todo_list"