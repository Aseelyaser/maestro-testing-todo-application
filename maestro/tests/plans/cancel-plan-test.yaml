appId: com.qacart.todo_app
---
- launchApp:
    clearState: true
- runFlow: 
    label: "Login flow"
    file: "../../flows/auth/login-flow.yaml"
    env: 
        EMAIL: "user@qacart.com"
        PASSWORD: "Test@1234"

- assertVisible:
    id: "plan_name"
    text: "Free plan"

- runFlow: 
    label: "Upgrade the plan"
    file: "../../flows/plans/upgrade-flow.yaml"
    env: 
        plan_option_id: "5"

- assertVisible:
    id: "plan_name"
    text: "Starter plan"
- tapOn:
    id: "cancel_subscription_button"
- tapOn:
    id: "cancel_subscription_confirm_button"
- assertVisible:
    id: "plan_name"
    text: "Free plan"

# challenge
- tapOn:
    id: "upgrade_button"
- tapOn:
    id: "terms_checkbox"
- tapOn:
    id: "plan_dropdown"
- tapOn:
    id: "plan_option_5"
- tapOn:
    id: "upgrade_confirm_button"

- tapOn:
    id: "new_todo_field"
- inputText: "1"
- tapOn:
    id: "add_todo_button"

- tapOn:
    id: "new_todo_field"
- inputText: "2"
- tapOn:
    id: "add_todo_button"

- tapOn:
    id: "new_todo_field"
- inputText: "3"
- tapOn:
    id: "add_todo_button"

- tapOn:
    id: "new_todo_field"
- inputText: "4"
- tapOn:
    id: "add_todo_button"

# - assertVisible:
#     id: "cancel_blocked_hint"

- assertVisible:
    id: "cancel_subscription_button"





