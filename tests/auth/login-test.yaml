appId: com.qacart.todo_app
name: "should be able to login to the application"
tags:
  - smoke
  - regression
env: 
        EMAIL: "user@qacart.com"
        PASSWORD: "Test@1234"
# we can use env on header level or on flow level, if we use on header level then it will be available for all flows in the test file, if we use on flow level then it will be available only for that flow
# onFlowStart:
#   - log: ""
# onFlowComplete:
#   - log: ""
---
- launchApp:
    clearState: true
- runFlow: 
    label: "Login flow"
    file: "../../flows/auth/login-flow.yaml"
- assertVisible:
    id: "plan_name"
    text: "Free plan"